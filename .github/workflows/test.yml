name: Tests

on:
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone test services
        run: git clone https://github.com/et891/p1.git

      - name: Start test services
        run:  docker compose -f test/docker-compose-test.yml up -d --build
        working-directory: acquiring-broker

      - name: Stop test services
        if: always()
        run: docker compose -f test/docker-compose-test.yml down -v
        working-directory: acquiring-broker
